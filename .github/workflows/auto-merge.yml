name: Auto Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Auto approve
        uses: hmarr/auto-approve-action@v4

      - name: Auto merge
        uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Default is "automerge" — empty string merges all passing PRs
          MERGE_LABELS: ""
          UPDATE_LABELS: ""
          MERGE_METHOD: squash
          MERGE_DELETE_BRANCH: true
          MERGE_FORKS: "true"
          MERGE_REQUIRED_APPROVALS: "0"
          MERGE_RETRIES: "6"
          MERGE_RETRY_SLEEP: "10000"
