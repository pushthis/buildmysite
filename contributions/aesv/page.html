b:hover + b + b + b + b + b + b + b + b,b:has( + b + b + b + b + b + b + b + b:hover){--k:0.30;transition-delay:0.32s;transition-duration:.45s}
b:hover + b + b + b + b + b + b + b + b + b,b:has( + b + b + b + b + b + b + b + b + b:hover){--k:0.20;transition-delay:0.36s;transition-duration:.45s}
b:hover + b + b + b + b + b + b + b + b + b + b,b:has( + b + b + b + b + b + b + b + b + b + b:hover){--k:0.10;transition-delay:0.40s;transition-duration:.45s}
@media (max-height:300px){p{display:none}.f{height:100vh}}
</style>
