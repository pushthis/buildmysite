<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>fats3an</title>
</head>
<body style="background: #0c0c0c; color: #4af626; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; padding: 20px;">

  <div style="background: #121212; border: 1px solid #333; border-radius: 6px; width: 100%; max-width: 580px; box-shadow: 0 12px 24px rgba(0,0,0,0.8); overflow: hidden;">
    
    <div style="background: #1f1f1f; padding: 8px 12px; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; gap: 6px;">
        <span style="width: 10px; height: 10px; background: #ff5f56; border-radius: 50%; display: inline-block;"></span>
        <span style="width: 10px; height: 10px; background: #ffbd2e; border-radius: 50%; display: inline-block;"></span>
        <span style="width: 10px; height: 10px; background: #27c93f; border-radius: 50%; display: inline-block;"></span>
      </div>
      <span style="font-size: 0.75rem; color: #777;">bash - fats3an@host:~</span>
    </div>

    <div style="padding: 20px; font-size: 0.9rem; line-height: 1.5;">
      <p style="margin: 0 0 10px 0;"><span style="color: #00bcff;">fats3an@host</span>:<span style="color: #ff0055;">~</span>$ whoami</p>
      <p style="margin: 0 0 15px 15px; color: #fff;">fats3an</p>

      <p style="margin: 0 0 10px 0;"><span style="color: #00bcff;">fats3an@host</span>:<span style="color: #ff0055;">~</span>$ uname -a</p>
      <p style="margin: 0 0 15px 15px; color: #aaa;">Linux host 6.8.0-generic #1 SMP PREEMPT_DYNAMIC x86_64 x86_64 x86_64 GNU/Linux</p>

      <p style="margin: 0 0 10px 0;"><span style="color: #00bcff;">fats3an@host</span>:<span style="color: #ff0055;">~</span>$ cat status.log</p>
      
      <table border="0" cellpadding="4" cellspacing="0" style="margin: 0 0 15px 15px; width: calc(100% - 15px); color: #4af626; font-family: monospace; font-size: 0.85rem;">
        <tr>
          <td style="color: #888; width: 120px;">SYSTEM_ID</td>
          <td>fats3an</td>
        </tr>
        <tr>
          <td style="color: #888;">PROCESS_STATE</td>
          <td style="color: #27c93f;">RUNNING</td>
        </tr>
        <tr>
          <td style="color: #888;">UPTIME</td>
          <td>99.9%</td>
        </tr>
      </table>

      <p style="margin: 0;"><span style="color: #00bcff;">fats3an@host</span>:<span style="color: #ff0055;">~</span>$ <span style="display: inline-block; width: 8px; height: 15px; background: #4af626; vertical-align: middle;"></span></p>
    </div>

  </div>

</body>
</html>
