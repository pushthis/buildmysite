<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore — Build My Site</title>
  <link rel="stylesheet" href="assets/css/site.css">
  <script data-goatcounter="https://terpinedream.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
</head>
<body class="retro-site">
  <div class="marquee-bar retro-marquee" aria-hidden="true">
    <div class="marquee-inner" id="marquee-content">
      <span>*** loading stats... ***</span>
    </div>
  </div>

  <div class="retro-wrap">
    <header class="retro-header">
      <img src="assets/banner.gif" alt="Build My Site!" class="retro-banner" width="480" height="120">
      <h1 class="retro-title">Explore the Site</h1>
      <p class="retro-intro">Every page the community has added — browse them all.</p>
    </header>

    <nav class="retro-nav" aria-label="Site navigation">
      <a href="index.html" class="retro-btn">Home</a>
      <a href="explore.html" class="retro-btn">Explore</a>
      <a href="https://github.com/pushthis/buildmysite/blob/main/CONTRIBUTING.md" class="retro-btn">Add Your Page</a>
    </nav>

    <hr class="retro-hr">

    <main class="retro-main">
      <div class="explore-controls">
        <button id="prev-page" type="button" class="retro-btn" disabled>&lt;&lt; Previous</button>
        <span id="page-info" class="retro-page-info">Page 1</span>
        <button id="next-page" type="button" class="retro-btn" disabled>Next &gt;&gt;</button>
      </div>
      <div class="explore-grid" id="explore-grid"></div>
    </main>

    <hr class="retro-hr">

    <footer class="retro-footer">
      <p class="retro-footer-links">
        <a href="https://tiktok.com/@thinkpad.enjoyer">TikTok</a>
        &nbsp;|&nbsp;
        <a href="https://www.youtube.com/@bustervd123">YouTube</a>
      </p>
      <p class="retro-footer-small">&copy; 2026 Build My Site</p>
    </footer>
  </div>

  <script type="module" src="assets/js/marquee.js?v=8"></script>
  <script type="module" src="assets/js/random-button.js?v=8"></script>
  <script type="module" src="assets/js/explore.js?v=8"></script>

</html>
