<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build My Site — Community Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script data-goatcounter="https://terpinedream.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <div class="marquee-bar" aria-hidden="true">
    <div class="marquee-inner" id="marquee-content">
      <span>Loading…</span>
    </div>
  </div>

  <header class="site-header">
    <h1>Build My Site</h1>
    <p>
      A community-built webpage — anyone can add their own page via a pull request.
      Explore contributions on the map or browse them all.
    </p>
    <nav class="site-nav">
      <a href="/">Home</a>
      <a href="/explore.html">Explore</a>
      <a href="https://github.com/pushthis/buildmysite/blob/main/CONTRIBUTING.md">How to contribute</a>
    </nav>
  </header>

  <main>
    <div id="map" role="region" aria-label="Contributor map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/assets/js/marquee.js"></script>
  <script src="/assets/js/random-button.js"></script>
  <script src="/assets/js/map.js"></script>
</body>
</html>
